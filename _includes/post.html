---
layout: base.html
full: true
---
<section class="panel welcome">
  <h2 class="panel-head">{{ title }}</h2>
  <div class="panel-body">
    <p class="post-meta"><time datetime="{{ date | isoDate }}">{{ date | readableDate }}</time></p>
    {{ content | safe }}
    <p><a href="/blog/">&larr; back to blog</a></p>
  </div>
</section>
